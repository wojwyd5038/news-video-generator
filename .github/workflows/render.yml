name: render

on:
  repository_dispatch:
    types: [make_trigger]

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install edge-tts "moviepy<2.0.0" google-api-python-client google-auth-oauthlib google-auth-httplib2
      - name: Generate Audio with Edge-TTS
        env:
          SCRIPT_TEXT: ${{ github.event.client_payload.script }}
        run: |
          edge-tts --voice pl-PL-MarekNeural --text "$SCRIPT_TEXT" --write-media input_audio.mp3

      - name: Render Video
        env:
          TITLE: ${{ github.event.client_payload.title }}
        run: |
          python render_video.py

      - name: Upload to YouTube
        env:
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
        run: |
          python upload_to_youtube.py
