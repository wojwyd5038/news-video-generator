name: Render and Upload Video

on:
  repository_dispatch:
    types: [make_trigger]

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          pip install moviepy google-api-python-client google-auth-oauthlib

      - name: Render Video
        env:
          VIDEO_TITLE: ${{ github.event.client_payload.title }}
          AUDIO_URL: ${{ github.event.client_payload.audio_url }}
        run: |
          curl -o input_audio.mp3 "$AUDIO_URL"
          python render_video.py

      - name: Upload to YouTube
        env:
          YOUTUBE_CREDENTIALS: ${{ secrets.YOUTUBE_CREDENTIALS }}
          VIDEO_TITLE: ${{ github.event.client_payload.title }}
          VIDEO_DESCRIPTION: ${{ github.event.client_payload.description }}
        run: |
          python upload_to_youtube.py
